id: pb-a2-ddos-applicatif
version: "1.0"
category: ddos_application
attack_code: A2
description: >
  A2 — DDoS applicatif (HTTP flood, Slowloris). Le volume réseau reste
  modeste : c'est l'épuisement des connexions et des sessions qui dégrade le
  service, donc la réponse est applicative et non volumétrique.
rules:
  - id: A2-01
    label: Limitation de débit par IP au pare-feu applicatif
    when:
      indicators_present: [srcip]
    actions:
      - verb: rate_limit_rule
        actuator: waf
        target: "{indicators.srcip}"
        parameters:
          requests_per_minute: 60
          scope: ip
          reason: "nombre de connexions anormal, temps de réponse dégrade"
        expected_effect: "Le rythme des requêtes redevient soutenable."

  - id: A2-02
    label: Fermeture des connexions inactives
    when:
      severity_min: medium
    actions:
      - verb: close_idle_connections
        actuator: service
        target: "{asset.asset_id}"
        parameters:
          idle_seconds: 30
          reason: "épuisement du pool de connexions (Slowloris)"
        expected_effect: >
          Les connexions maintenues ouvertes sans trafic sont liberees ; le
          service retrouve des emplacements pour les clients légitimes.
