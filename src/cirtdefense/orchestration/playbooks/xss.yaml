id: pb-b2-xss
version: "1.0"
category: xss
attack_code: B2
description: >
  B2 — XSS. La reponse depend de l'etat : un contenu non encore stocke se
  bloque, un contenu deja stocke ne peut qu'etre signale — le retirer
  toucherait des donnees applicatives, ce qui sort du perimetre autonome.
rules:
  - id: B2-01
    label: Blocage de la requete porteuse
    when:
      indicators_present: [pattern]
    actions:
      - verb: block_pattern
        actuator: waf
        target: "{indicators.pattern}"
        parameters:
          rule_type: xss
        blast_radius: 3

  - id: B2-02
    label: Sanitisation a la volee du champ concerne
    when:
      indicators_present: [field]
    actions:
      - verb: sanitize_field
        actuator: waf
        target: "{indicators.field}"
        parameters:
          mode: escape_html

  - id: B2-03
    label: Contenu deja stocke — signalement, pas de retrait automatique
    when:
      severity_min: high
    actions:
      - verb: notify
        actuator: notify
        target: "analyste"
        parameters:
          channel: analyst
          severity: medium
          subject: "B2 — XSS potentiellement stocke"
          body: >
            Un contenu suspect a peut-etre ete stocke avant blocage. Son
            retrait n'est pas engage automatiquement : modifier des donnees
            applicatives sort du perimetre des actions reversibles maitrisees.
