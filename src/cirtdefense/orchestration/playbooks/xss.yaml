id: pb-b2-xss
version: "1.0"
category: xss
attack_code: B2
description: >
  B2 — XSS. La réponse dépend de l'état : un contenu non encore stocké se
  bloque, un contenu déjà stocké ne peut qu'être signalé — le retirer
  toucherait des données applicatives, ce qui sort du périmètre autonome.
rules:
  - id: B2-01
    label: Blocage de la requête porteuse
    when:
      indicators_present: [pattern]
    actions:
      - verb: block_pattern
        actuator: waf
        target: "{indicators.pattern}"
        parameters:
          rule_type: xss
        blast_radius: 3

  - id: B2-02
    label: Sanitisation à la volée du champ concerné
    when:
      indicators_present: [field]
    actions:
      - verb: sanitize_field
        actuator: waf
        target: "{indicators.field}"
        parameters:
          mode: escape_html

  - id: B2-03
    label: Contenu déjà stocké — signalement, pas de retrait automatique
    when:
      severity_min: high
    actions:
      - verb: notify
        actuator: notify
        target: "analyste"
        parameters:
          channel: analyst
          severity: medium
          subject: "B2 — XSS potentiellement stocké"
          body: >
            Un contenu suspect a peut-être été stocké avant blocage. Son
            retrait n'est pas engage automatiquement : modifier des données
            applicatives sort du périmètre des actions réversibles maitrisees.
