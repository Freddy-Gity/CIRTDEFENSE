id: pb-lateral-movement
version: "1.0"
category: lateral_movement
description: Coupure d'une progression latérale dans le réseau.
rules:
  - id: LM-01
    label: Compte porteur de la progression identifiée
    when:
      user_present: true
      confidence_min: 0.5
    actions:
      - verb: revoke_sessions
        actuator: iam
        target: "{asset.user}"
        parameters:
          reason: "progression latérale"
      - verb: disable_account
        actuator: iam
        target: "{asset.user}"
        parameters:
          reason: "compte utilise pour un déplacement latéral"
        when_severity_min: high

  - id: LM-02
    label: Machine d'origine identifiée, plusieurs comptes impliques
    when:
      severity_min: high
    actions:
      - verb: isolate_host
        actuator: edr
        target: "{asset.asset_id}"
        parameters:
          keep_agent_channel: true
          reason: "point de depart d'une progression latérale"
