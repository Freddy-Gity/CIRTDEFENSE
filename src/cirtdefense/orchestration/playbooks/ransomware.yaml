id: pb-a6-ransomware
version: "1.0"
category: ransomware
attack_code: A6
description: >
  A6 — Rançongiciel. Point de vigilance explicite du catalogue : la réponse
  automatique reste l'isolation réseau, JAMAIS une remédiation complète. Aucune
  action irréversible (effacement, réinitialisation) n'est engagee, quelle que
  soit la gravité constatée.
rules:
  - id: A6-01
    label: Isolation réseau immédiate de l'hôte
    when:
      confidence_min: 0.5
    actions:
      - verb: move_to_vlan
        actuator: network
        target: "{asset.asset_id}"
        parameters:
          vlan: quarantine
          previous_vlan: vlan-production
          reason: "chiffrement de masse détecte"
        expected_effect: "L'hôte est place en VLAN de quarantaine."

      - verb: block_lateral
        actuator: network
        target: "{asset.asset_id}"
        parameters:
          protocols: [smb, rdp, winrm]
        expected_effect: >
          Les protocoles de propagation sont coupes, sans isoler completement
          l'hôte de son agent de sécurité.

  - id: A6-02
    label: Instantané de sauvegarde si disponible
    when:
      severity_min: high
    actions:
      - verb: trigger_snapshot
        actuator: backup
        target: "{asset.asset_id}"
        parameters:
          reason: "preservation de l'état avant progression du chiffrement"
        expected_effect: >
          L'état courant est préservé. L'instantané n'est jamais supprimé
          automatiquement : il garde sa valeur de preuve.

  - id: A6-03
    label: Processus de chiffrement identifié
    when:
      indicators_present: [process]
    actions:
      - verb: kill_process
        actuator: edr
        target: "{indicators.process}"
        parameters:
          host: "{asset.asset_id}"
        expected_effect: "Le chiffrement en cours est interrompu."

  - id: A6-04
    label: Alerte — la remédiation reste humaine
    when: {}
    actions:
      - verb: notify
        actuator: notify
        target: "analyste"
        parameters:
          channel: analyst
          severity: critical
          subject: "A6 — Rançongiciel confine, remédiation à decider"
          body: >
            Un rançongiciel a été confine par isolation réseau. La remédiation
            (restauration, reinstallation) n'est PAS engagee automatiquement :
            elle est irréversible et releve d'une décision humaine après
            investigation. Les données déjà chiffrées ne sont pas recouvrees
            par l'isolation.
