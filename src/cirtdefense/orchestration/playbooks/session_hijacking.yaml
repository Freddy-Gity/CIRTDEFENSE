id: pb-b7-session-hijacking
version: "1.0"
category: session_hijacking
attack_code: B7
description: >
  B7 — Detournement de session. Revocation de la session et re-authentification
  forcee : d'impact limite pour l'utilisateur legitime, decisif contre un
  attaquant qui detient un jeton valide.
rules:
  - id: B7-01
    label: Revocation de la session detournee
    when:
      user_present: true
    actions:
      - verb: revoke_sessions
        actuator: iam
        target: "{asset.user}"
        parameters:
          reason: "session utilisee depuis deux localisations incompatibles"

      - verb: force_mfa
        actuator: iam
        target: "{asset.user}"
        parameters:
          reason: "re-authentification renforcee apres detournement suppose"
        expected_effect: >
          L'utilisateur legitime se reauthentifie ; l'attaquant, qui ne
          detient pas le second facteur, en est empeche.

  - id: B7-02
    label: Jeton identifie
    when:
      indicators_present: [token_id]
    actions:
      - verb: revoke_token
        actuator: iam
        target: "{indicators.token_id}"
        parameters:
          reason: "jeton reutilise"
