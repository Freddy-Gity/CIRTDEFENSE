id: pb-d4-derive-configuration
version: "1.0"
category: config_drift
attack_code: D4
description: >
  D4 — Dérive de configuration. La restauration automatique n'est admise que
  si le delta est mineur : au-delà, restaurer une référence obsolete
  ecraserait un changement légitime recent.
rules:
  - id: D4-01
    label: Restauration si la dérive est mineure
    when:
      indicators_present: [delta_count]
    actions:
      - verb: restore_baseline
        actuator: config
        target: "{asset.asset_id}"
        parameters:
          delta_count: "{indicators.delta_count}"
          reason: "écart à la configuration de référence"
        expected_effect: >
          La configuration de référence est rétablie. L'actuateur refuse
          au-delà du seuil qui définit une dérive mineure.

  - id: D4-02
    label: Signalement systématique
    when: {}
    actions:
      - verb: notify
        actuator: notify
        target: "equipe-exploitation"
        parameters:
          channel: ops
          severity: low
          subject: "D4 — Dérive de configuration constatée"
          body: >
            Un écart a été constaté avec la configuration de référence. La
            restauration automatique n'est engagee que si le delta est mineur ;
            au-delà, elle est refusée pour ne pas écraser un changement
            légitime recent.
