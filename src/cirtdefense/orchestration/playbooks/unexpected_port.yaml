id: pb-d2-port-inattendu
version: "1.0"
category: unexpected_port
attack_code: D2
description: >
  D2 — Port inattendu ouvert. Le catalogue conditionne la fermeture au fait
  que le port soit sous contrôle de la plateforme ; sinon, alerte de dérive.
rules:
  - id: D2-01
    label: Fermeture du port si sous contrôle
    when:
      indicators_present: [port]
      severity_min: medium
    actions:
      - verb: close_port
        actuator: config
        target: "{indicators.port}"
        parameters:
          host: "{asset.asset_id}"
          reason: "port absent de la configuration attendue"
        expected_effect: "Le port est fermé et peut être rouvert."

  - id: D2-02
    label: Signalement de dérive de configuration
    when: {}
    actions:
      - verb: notify
        actuator: notify
        target: "equipe-exploitation"
        parameters:
          channel: ops
          severity: medium
          subject: "D2 — Port inattendu ouvert"
          body: >
            Un écart a été constaté entre les ports observés et la
            configuration attendue. Si le port n'est pas sous contrôle de la
            plateforme, sa fermeture n'a pas été engagee : il s'agit alors
            d'une dérive à traiter par l'équipe d'exploitation.
