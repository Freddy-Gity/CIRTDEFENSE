id: pb-c2-acces-hors-profil
version: "1.0"
category: abnormal_access
attack_code: C2
description: >
  C2 — Accès a des ressources hors profil. Le catalogue est explicite : PAS de
  révocation de compte, le risque de faux positif étant ici plus élevé
  qu'ailleurs. Un utilisateur peut légitimement changer de périmètre métier.
rules:
  - id: C2-01
    label: Blocage de l'accès en cours
    when:
      user_present: true
      indicators_present: [resource]
    actions:
      - verb: block_resource_access
        actuator: iam
        target: "{asset.user}"
        parameters:
          resource: "{indicators.resource}"
          reason: "ressource jamais accédée par cette entité, hors périmètre métier"
        expected_effect: >
          L'accès en cours est interrompu sans toucher au compte lui-même.

  - id: C2-02
    label: Signalement — aucune action sur le compte
    when: {}
    actions:
      - verb: notify
        actuator: notify
        target: "analyste"
        parameters:
          channel: analyst
          severity: low
          subject: "C2 — Accès hors profil habituel"
          body: >
            Une entité a consulté une ressource hors de son périmètre habituel.
            Le compte n'a PAS été révoqué : sur ce type d'anomalie le risque de
            faux positif est élevé, et l'immobilisation d'un utilisateur
            légitime coûterait plus que l'accès constaté.
