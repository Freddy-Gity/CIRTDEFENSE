<style>
/* Palette de visualisation validee : bandes de clarte, plancher de chroma,
   separation CVD et contrastes verifies pour les deux modes. Les quatre
   teintes categorielles portent les quatre familles du catalogue CIRT ; les
   couleurs d'etat sont reservees et ne servent jamais de teinte de serie. */
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --plane: #f9f9f7;
  --rail: #f4f4f1;
  --ink-1: #0b0b0b;
  --ink-2: #52514e;
  --ink-muted: #898781;
  --grid: #e1e0d9;
  --ring: rgba(11, 11, 11, .10);

  --fam-A: #2a78d6; --fam-B: #eb6834; --fam-C: #1baf7a; --fam-D: #eda100;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --success-text: #006300;
  --accent: var(--fam-A);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-1: #1a1a19; --plane: #0d0d0d; --rail: #151514;
    --ink-1: #fff; --ink-2: #c3c2b7; --ink-muted: #898781;
    --grid: #2c2c2a; --ring: rgba(255, 255, 255, .10);
    --fam-A: #3987e5; --fam-B: #d95926; --fam-C: #199e70; --fam-D: #c98500;
    --success-text: #0ca30c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19; --plane: #0d0d0d; --rail: #151514;
  --ink-1: #fff; --ink-2: #c3c2b7; --ink-muted: #898781;
  --grid: #2c2c2a; --ring: rgba(255, 255, 255, .10);
  --fam-A: #3987e5; --fam-B: #d95926; --fam-C: #199e70; --fam-D: #c98500;
  --success-text: #0ca30c;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--plane); color: var(--ink-1);
  font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-columns: 232px 1fr;
}

/* ------------------------------- barre laterale ------------------------- */
#rail {
  background: var(--rail); border-right: 1px solid var(--ring);
  display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0;
}
.marque { padding: 16px 16px 12px; display: flex; align-items: center; gap: 9px; }
.marque .logo {
  width: 26px; height: 26px; border-radius: 7px; flex: none;
  background: var(--accent); color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 13px;
}
.marque .nom { font-weight: 700; font-size: 14px; letter-spacing: .01em; }
.marque .ver { font-size: 11px; color: var(--ink-muted); }

#nav { display: flex; flex-direction: column; flex: 1; padding: 4px 8px 12px; gap: 1px; }
#nav .flex { flex: 1; min-height: 14px; }
#nav .sep { height: 1px; background: var(--grid); margin: 8px 8px; }
.lien-nav {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
  color: var(--ink-2); font-size: 13px; text-decoration: none;
  border: none; background: none; width: 100%; text-align: left; font-family: inherit;
}
.lien-nav:hover { background: var(--surface-1); color: var(--ink-1); }
.lien-nav[aria-current="page"] {
  background: var(--surface-1); color: var(--ink-1); font-weight: 600;
  box-shadow: inset 2px 0 0 var(--accent);
}
.lien-nav svg { width: 17px; height: 17px; flex: none; }
.lien-nav .pastille {
  margin-left: auto; font-size: 11px; font-weight: 600; padding: 1px 7px;
  border-radius: 999px; background: var(--grid); color: var(--ink-2);
}

/* --------------------------------- contenu ------------------------------ */
#contenu { min-width: 0; display: flex; flex-direction: column; height: 100vh; overflow: auto; }
#entete {
  position: sticky; top: 0; z-index: 5; background: var(--surface-1);
  border-bottom: 1px solid var(--ring); padding: 13px 24px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
#entete h1 { font-size: 15px; margin: 0; font-weight: 650; }
#entete .sous { font-size: 12px; color: var(--ink-muted); }
.spacer { margin-left: auto; }
main { padding: 20px 24px 44px; max-width: 1320px; width: 100%; }

button, .btn {
  font: inherit; cursor: pointer; border-radius: 7px; padding: 6px 12px;
  border: 1px solid var(--ring); background: var(--surface-1); color: var(--ink-1);
  text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
}
button:hover, .btn:hover { background: var(--plane); }
button.primaire { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primaire:hover { filter: brightness(1.08); }
button:disabled { opacity: .5; cursor: progress; }
select, input {
  font: inherit; padding: 6px 10px; border-radius: 7px;
  border: 1px solid var(--ring); background: var(--surface-1); color: var(--ink-1);
}

h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
     color: var(--ink-muted); margin: 24px 0 10px; font-weight: 600; }
h2:first-child { margin-top: 0; }
.carte { background: var(--surface-1); border: 1px solid var(--ring); border-radius: 9px; padding: 14px 16px; }
.grille { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); }

/* --- EF-28 / EF-29 : ce qui attend une decision humaine ------------------
   Ces deux blocs coiffent la vue d'ensemble tant qu'ils ont du contenu.
   Leur persistance est le mecanisme : une notification se lit une fois, une
   ligne en attente se represente a chaque consultation. */
.alerte-durable { border-left: 3px solid var(--critical); margin-bottom: 16px; }
.alerte-qualif  { border-left: 3px solid var(--warning);  margin-bottom: 16px; }
.tete-alerte { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.choix { display: flex; gap: 6px; flex-wrap: wrap; }
.choix button { white-space: nowrap; font-size: 12px; padding: 5px 11px; }
.alerte-durable td { vertical-align: top; }
.fiche { border: 1px solid var(--ring); border-radius: 7px; padding: 12px 14px; margin-top: 10px; }
.champ-fiche label { display: block; font-size: 11px; color: var(--ink-muted);
  text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.champ-fiche input { width: 100%; padding: 7px 10px; border-radius: 6px;
  border: 1px solid var(--ring); background: var(--surface-0); color: var(--ink-1);
  font-size: 13px; font-family: inherit; }
.ligne-fiche { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 9px; font-size: 12px; }

/* Six tuiles se repartissent en 5+1 avec auto-fit, ce qui laisse la derniere
   isolee. Sur large ecran on impose trois colonnes : deux rangees egales. */
@media (min-width: 1180px) { .grille.six { grid-template-columns: repeat(3, 1fr); } }
.tuile .valeur { font-size: 26px; font-weight: 600; line-height: 1.15; }
.tuile .libelle { color: var(--ink-2); font-size: 12px; margin-top: 2px; }
.tuile .note { color: var(--ink-muted); font-size: 11px; margin-top: 7px; line-height: 1.4; }

/* Alerte : reservee aux etats qui exigent un geste, jamais a une explication. */
.bandeau { padding: 10px 15px; border-radius: 9px; border: 1px solid; font-weight: 500; }
.bandeau.suspendu { border-color: var(--critical); color: var(--critical);
                    background: color-mix(in srgb, var(--critical) 9%, var(--surface-1)); }

/* ---------------------------- bascule d'autonomie -----------------------
   L'etat n'est jamais porte par la seule couleur : le voyant est double d'un
   mot (« active » / « suspendue »), lisible sans distinguer vert et rouge. */
.menu { position: relative; }
.bascule {
  display: inline-flex; align-items: center; gap: 7px; font-weight: 600;
  padding: 6px 10px; border-radius: 8px; border: 1px solid var(--ring);
  background: var(--surface-1); color: var(--ink-1); cursor: pointer; font-size: 13px;
}
.bascule:hover { border-color: var(--ink-muted); }
.bascule .chevron { width: 13px; height: 13px; opacity: .55; }
.bascule .voyant {
  width: 9px; height: 9px; border-radius: 50%; flex: none;
  background: var(--ink-muted); box-shadow: 0 0 0 3px transparent;
}
.bascule.actif { border-color: var(--good); color: var(--success-text); }
.bascule.actif .voyant {
  background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent);
}
.bascule.suspendu { border-color: var(--critical); color: var(--critical); }
.bascule.suspendu .voyant {
  background: var(--critical);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--critical) 22%, transparent);
}
.menu-liste {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; min-width: 168px;
  background: var(--surface-1); border: 1px solid var(--grid); border-radius: 10px;
  padding: 5px; box-shadow: 0 10px 28px rgba(0, 0, 0, .16);
}
.menu-liste button {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  padding: 7px 9px; border: none; border-radius: 7px; background: none;
  color: var(--ink-1); font-size: 13px; cursor: pointer;
}
.menu-liste button:hover { background: var(--plane); }
.point { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.point.vert { background: var(--good); }
.point.rouge { background: var(--critical); }

/* --------------------------------- modales ------------------------------
   Le fond est floute pour que la saisie soit le seul point net de l'ecran :
   pendant une declaration, rien d'autre ne doit reclamer l'attention. */
.voile {
  position: fixed; inset: 0; z-index: 90; display: grid; place-items: center;
  padding: 24px; background: color-mix(in srgb, var(--plane) 62%, transparent);
  backdrop-filter: blur(7px) saturate(.85); -webkit-backdrop-filter: blur(7px) saturate(.85);
  animation: voile-entre .16s ease-out;
}
@keyframes voile-entre { from { opacity: 0 } to { opacity: 1 } }
.modale {
  background: var(--surface-1); border: 1px solid var(--grid); border-radius: 14px;
  width: min(100%, 620px); max-height: min(86vh, 900px); overflow: auto;
  box-shadow: 0 24px 64px rgba(0, 0, 0, .26); animation: modale-entre .18s ease-out;
}
.modale.large { width: min(100%, 1000px); }
@keyframes modale-entre { from { opacity: 0; transform: translateY(10px) scale(.985) } }
.modale header {
  display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 12px;
  border-bottom: 1px solid var(--grid); position: sticky; top: 0;
  background: var(--surface-1); z-index: 1;
}
/* Un titre de fenetre est une phrase, pas une etiquette de section : il
   reprend la casse normale. */
.modale header h2 {
  margin: 0; font-size: 16px; text-transform: none; letter-spacing: 0;
  color: var(--ink-1); font-weight: 650;
}
.modale header .sous { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
.modale .corps { padding: 18px 20px; }
.modale .pied {
  display: flex; justify-content: flex-end; gap: 9px;
  padding: 13px 20px; border-top: 1px solid var(--grid);
  position: sticky; bottom: 0; background: var(--surface-1);
}
.fermer {
  margin-left: auto; border: none; background: none; color: var(--ink-muted);
  font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 6px;
}
.fermer:hover { background: var(--plane); color: var(--ink-1); }

/* formulaire */
.champs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.champ { display: flex; flex-direction: column; gap: 5px; }
.champ.pleine { grid-column: 1 / -1; }
.champ label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.champ .indice { font-size: 11px; color: var(--ink-muted); }
.champ input, .champ select, .champ textarea {
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--grid);
  background: var(--plane); color: var(--ink-1); font: inherit; font-size: 13px;
}
.champ input:focus, .champ select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.champ.invalide input, .champ.invalide select { border-color: var(--critical); }
.champ .erreur { font-size: 11px; color: var(--critical); }

/* --------------------------- carte de surveillance ---------------------
   Une vraie carte : projection Web Mercator, deplacement et zoom. Pas de
   fond de tuiles (la plateforme reste utilisable hors connexion) : le
   reperage se fait au graticule lat/lon et aux anneaux de portee. Le
   balayage radar tourne sans fin autour d'un centre FIXE — le siege — qui
   reste accroche a sa coordonnee quel que soit le zoom. */
.carte-geo {
  position: relative; height: 440px; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--grid);
  background:
    radial-gradient(circle at 50% 50%,
      color-mix(in srgb, var(--fam-A) 8%, var(--surface-1)), var(--surface-1) 74%);
  cursor: grab; touch-action: none; user-select: none;
}
.carte-geo.attrape { cursor: grabbing; }
.carte-geo:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.geo-grille { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.geo-grille .gl { stroke: var(--grid); stroke-width: 1; }
.geo-grille .gt {
  fill: var(--ink-muted); font-size: 9px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.geo-grille .ga {
  fill: none; stroke: color-mix(in srgb, var(--fam-C) 32%, transparent); stroke-dasharray: 3 4;
}
.geo-grille .gac { fill: color-mix(in srgb, var(--fam-C) 55%, var(--ink-muted)); text-anchor: middle; }

/* balayage : la rotation est sur .geo-balayage seule, origine au centre —
   aucune translation, donc aucune derive. Le parent .geo-radar ne fait que
   se positionner (JS) sur la coordonnee du siege. */
.geo-radar {
  position: absolute; border-radius: 50%; pointer-events: none;
  transform: translate(-50%, -50%); overflow: hidden;
}
.geo-balayage {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg,
    color-mix(in srgb, var(--fam-C) 30%, transparent) 0deg,
    color-mix(in srgb, var(--fam-C) 9%, transparent) 18deg,
    color-mix(in srgb, var(--fam-C) 2%, transparent) 40deg,
    transparent 70deg, transparent 360deg);
  /* le faisceau s'estompe vers l'exterieur : pas de bord franc dans le cadre */
  -webkit-mask: radial-gradient(closest-side, #000 55%, transparent 100%);
  mask: radial-gradient(closest-side, #000 55%, transparent 100%);
  animation: geo-balaye 4s linear infinite;
}
/* arete de tete du balayage */
.geo-balayage::before {
  content: ""; position: absolute; left: 50%; top: 0; width: 1px; height: 50%;
  background: linear-gradient(color-mix(in srgb, var(--fam-C) 55%, transparent), transparent);
}
@keyframes geo-balaye { to { transform: rotate(360deg) } }
/* Consigne : le balayage ne s'arrete jamais. En mouvement reduit il ralentit
   seulement. */
@media (prefers-reduced-motion: reduce) { .geo-balayage { animation-duration: 16s; } }

.geo-calque { position: absolute; inset: 0; pointer-events: none; }
.geo-plot, .geo-siege { position: absolute; top: 0; left: 0; display: grid; place-items: center; }
.geo-siege { pointer-events: none; }
.geo-plot { border: none; background: none; padding: 0; cursor: pointer; pointer-events: auto; }
.geo-pastille {
  width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--surface-1);
  background: var(--good); box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
}
.geo-plot[data-etat="degrade"] .geo-pastille { background: var(--warning); }
.geo-plot[data-etat="injoignable"] .geo-pastille { background: var(--critical); }
.geo-plot[data-etat="injoignable"]::before {
  content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid var(--critical); animation: onde 1.8s ease-out infinite;
}
@keyframes onde { to { transform: scale(3.6); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .geo-plot[data-etat="injoignable"]::before { animation: none } }
.geo-siege > span:first-child {
  width: 13px; height: 13px; transform: rotate(45deg);
  border: 2px solid var(--accent);
  background: color-mix(in srgb, var(--accent) 24%, var(--surface-1));
}
/* Les plateformes sont souvent groupees sur quelques centaines de metres :
   les noms ne s'affichent qu'au survol (le tableau en dessous les liste
   tous). Le siege garde le sien en permanence. */
.geo-nom {
  position: absolute; top: 11px; white-space: nowrap; font-size: 10.5px; font-weight: 600;
  color: var(--ink-2); background: color-mix(in srgb, var(--surface-1) 88%, transparent);
  padding: 0 3px; border-radius: 3px; pointer-events: none;
  opacity: 0; transition: opacity .12s ease;
}
.geo-plot:hover .geo-nom, .geo-plot:focus-visible .geo-nom,
.geo-siege .geo-nom { opacity: 1; }
.geo-siege .geo-nom { color: var(--accent); box-shadow: 0 1px 5px rgba(0, 0, 0, .18); }
.geo-plot:hover, .geo-plot:focus-visible { z-index: 5; }
.geo-plot:hover .geo-pastille, .geo-plot:focus-visible .geo-pastille { transform: scale(1.3); }
.geo-plot:hover .geo-nom { box-shadow: 0 1px 6px rgba(0, 0, 0, .2); }

.geo-commandes {
  position: absolute; right: 10px; top: 10px; z-index: 6;
  display: flex; flex-direction: column; gap: 4px;
}
.geo-commandes button {
  width: 30px; height: 30px; padding: 0; border-radius: 7px; border: 1px solid var(--grid);
  background: var(--surface-1); color: var(--ink-1); font-size: 15px; cursor: pointer;
  display: grid; place-items: center; line-height: 1;
}
.geo-commandes button:hover { border-color: var(--accent); color: var(--accent); }
.geo-rose {
  position: absolute; left: 10px; top: 10px; z-index: 6;
  width: 22px; height: 22px; display: grid; place-items: center;
  font-size: 10px; font-weight: 700; color: var(--ink-muted);
  border: 1px solid var(--grid); border-radius: 50%; background: var(--surface-1);
}
.geo-infos {
  position: absolute; left: 10px; bottom: 10px; z-index: 6;
  display: flex; align-items: flex-end; gap: 12px; font-size: 10.5px; color: var(--ink-muted);
  background: color-mix(in srgb, var(--surface-1) 80%, transparent);
  padding: 4px 8px; border-radius: 6px;
}
.geo-echelle {
  display: inline-block; height: 5px; align-self: flex-end;
  border: 1px solid var(--ink-muted); border-top: none; position: relative;
}
.geo-echelle::after {
  content: attr(data-lib); position: absolute; left: 0; top: -13px; white-space: nowrap;
}

.legende-plan {
  display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px;
  color: var(--ink-muted); margin-top: 10px;
}
.legende-plan span { display: inline-flex; align-items: center; gap: 6px; }
.legende-plan i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.geo-pin-siege {
  width: 9px !important; height: 9px !important; border-radius: 0 !important;
  transform: rotate(45deg); border: 2px solid var(--accent);
  background: color-mix(in srgb, var(--accent) 24%, transparent);
}

/* Un nom de plateforme est cliquable : bouton, pas lien, car il n'ouvre pas
   une adresse mais une fenetre. */
.lien {
  border: none; background: none; padding: 0; font: inherit; color: var(--accent);
  cursor: pointer; text-align: left;
}
.lien:hover { text-decoration: underline; }

/* --------------------------- sections repliables ------------------------ */
.entete-section {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: none; border: none; padding: 0; margin: 22px 0 10px;
  cursor: pointer; color: var(--ink-1); text-align: left;
}
.entete-section h2 { margin: 0; }
.entete-section .compte {
  font-size: 11px; color: var(--ink-muted); font-weight: 600;
  background: var(--plane); border: 1px solid var(--grid);
  border-radius: 20px; padding: 1px 8px;
}
.entete-section .chevron {
  width: 15px; height: 15px; margin-left: auto; color: var(--ink-muted);
  transition: transform .18s ease;
}
.entete-section[aria-expanded="false"] .chevron { transform: rotate(-90deg); }
.repliable[hidden] { display: none; }

/* ------------------------------ bulle assistant -------------------------
   Une conversation, pas un formulaire : le fil se lit de haut en bas, la
   reponse s'ecrit pendant qu'on la lit, et la reflexion est visible plutot
   que masquee derriere un sablier. */
#lanceur-chat {
  position: fixed; right: 22px; bottom: 22px; z-index: 70;
  width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--accent); color: #fff; display: grid; place-items: center;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .24); transition: transform .16s ease;
}
#lanceur-chat:hover { transform: translateY(-2px) scale(1.04); }
#lanceur-chat svg { width: 23px; height: 23px; }
#lanceur-chat[hidden] { display: none; }

#chat {
  position: fixed; right: 22px; bottom: 22px; z-index: 80;
  width: min(calc(100vw - 44px), 440px); height: min(calc(100vh - 44px), 640px);
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--surface-1); border: 1px solid var(--grid); border-radius: 16px;
  box-shadow: 0 20px 56px rgba(0, 0, 0, .28); animation: chat-entre .18s ease-out;
}
#chat[hidden] { display: none; }
@keyframes chat-entre { from { opacity: 0; transform: translateY(14px) scale(.98) } }
#chat.plein {
  right: 50%; bottom: 50%; transform: translate(50%, 50%);
  width: min(calc(100vw - 64px), 1180px); height: min(calc(100vh - 64px), 920px);
  flex-direction: row;
}
#corps-chat { display: flex; flex-direction: column; flex: 1; min-width: 0; overflow: hidden; }

/* ------------------------ barre laterale de l'assistant -----------------
   Elle n'apparait qu'en grand ecran : dans une bulle de 440 px, un rail
   d'historique prendrait la place du fil qu'il sert a retrouver. */
#rail-chat { display: none; }
#chat.plein #rail-chat {
  display: flex; flex-direction: column; width: 252px; flex: none;
  border-right: 1px solid var(--grid); background: var(--rail);
}
.marque-chat {
  display: flex; align-items: center; gap: 9px; padding: 15px 15px 12px;
}
.marque-chat .logo {
  width: 26px; height: 26px; border-radius: 7px; flex: none;
  background: var(--accent); color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 13px;
}
/* Meme police que la marque, corps reduit : l'assistant se presente comme une
   piece de la plateforme, pas comme un produit voisin. */
.marque-chat .nom { font-weight: 700; font-size: 14px; letter-spacing: .01em; }
.marque-chat .sous-nom {
  font-weight: 700; font-size: 9.5px; letter-spacing: .14em;
  color: var(--ink-muted); margin-top: 1px;
}

.barre-outils {
  display: flex; align-items: center; gap: 4px; padding: 0 11px 11px;
}
.barre-outils > button, .barre-outils .menu > button {
  border: 1px solid var(--grid); background: var(--surface-1); color: var(--ink-2);
  border-radius: 8px; cursor: pointer; padding: 6px; display: grid; place-items: center;
  position: relative;
}
.barre-outils button:hover { border-color: var(--accent); color: var(--accent); }
.barre-outils svg { width: 15px; height: 15px; }
.barre-outils .neuf {
  margin-left: auto; display: flex; gap: 5px; align-items: center;
  padding: 6px 10px; font-size: 12px; font-weight: 600;
}
.pastille-filtre {
  position: absolute; top: -3px; right: -3px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--accent);
}

.entete-fils {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: none; border: none; cursor: pointer; color: var(--ink-muted);
  padding: 6px 14px; font-size: 10.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em;
}
.entete-fils .chevron {
  width: 13px; height: 13px; margin-left: auto; transition: transform .18s ease;
}
.entete-fils[aria-expanded="false"] .chevron { transform: rotate(-90deg); }

#fils { flex: 1; overflow-y: auto; padding: 2px 9px 12px; display: flex;
        flex-direction: column; gap: 1px; }
#fils[hidden] { display: none; }
.fil-item {
  display: block; width: 100%; text-align: left; border: none; background: none;
  padding: 7px 9px; border-radius: 8px; cursor: pointer; color: var(--ink-1);
}
.fil-item:hover { background: var(--surface-1); }
.fil-item[aria-current="true"] {
  background: var(--surface-1); box-shadow: inset 2px 0 0 var(--accent);
}
.fil-item .titre-fil {
  font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap;
}
.fil-item .meta-fil {
  font-size: 10.5px; color: var(--ink-muted); margin-top: 2px;
  display: flex; align-items: center; gap: 6px;
}
.genre {
  font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  padding: 0 5px; border-radius: 4px; border: 1px solid var(--grid); color: var(--ink-muted);
}
.genre.simulation { color: var(--fam-B); border-color: color-mix(in srgb, var(--fam-B) 40%, transparent); }
.genre.rapport { color: var(--fam-A); border-color: color-mix(in srgb, var(--fam-A) 40%, transparent); }
.genre.bilan { color: var(--fam-C); border-color: color-mix(in srgb, var(--fam-C) 40%, transparent); }
.fil-vide { padding: 14px 11px; font-size: 12px; color: var(--ink-muted); }

/* menu de filtres : ancre a gauche, sinon il deborde du panneau et retombe
   par-dessus la barre laterale de l'application. */
/* Le menu est cale sur le bord du rail, pas sur son bouton : ancre au bouton,
   il depasserait des 252 px de la colonne et se ferait rogner. */
#menu-filtres .menu-liste { left: -31px; right: auto; z-index: 90; }

/* Menu a deux niveaux. Tout deroule d'un coup, les trois axes et leurs
   options tenaient sur une hauteur que #chat rognait : on n'atteignait pas
   le bas. On n'affiche donc qu'un niveau a la fois — les trois axes, puis
   les options de celui qu'on ouvre. Selecteurs prefixes par #filtres-liste
   pour passer devant la regle generique `.menu-liste button`. */
.menu-liste.large { min-width: 206px; max-width: 224px; padding: 4px; }

#filtres-liste .axe-filtre,
#filtres-liste .retour-filtre {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  padding: 8px 9px; border: none; border-radius: 7px; background: none;
  color: var(--ink-1); font-size: 13px; cursor: pointer;
}
#filtres-liste .axe-filtre:hover,
#filtres-liste .retour-filtre:hover { background: var(--plane); }
#filtres-liste .axe-filtre .nom-axe { flex: 1; }
#filtres-liste .axe-filtre .val-axe {
  font-size: 11px; font-weight: 600; color: var(--accent);
  max-width: 82px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#filtres-liste .fleche {
  width: 14px; height: 14px; flex: none; color: var(--ink-muted);
}
#filtres-liste .retour-filtre {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  color: var(--ink-muted); border-bottom: 1px solid var(--grid);
  border-radius: 7px 7px 0 0; margin-bottom: 3px;
}
#filtres-liste .options-axe { display: flex; flex-direction: column; gap: 1px; }
#filtres-liste .options-axe button {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; text-align: left; padding: 7px 9px; border: none; border-radius: 7px;
  background: none; color: var(--ink-1); font-size: 13px; font-weight: 400; cursor: pointer;
}
#filtres-liste .options-axe button:hover { background: var(--plane); }
#filtres-liste .options-axe button[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
#filtres-liste .options-axe button svg { width: 14px; height: 14px; flex: none; color: var(--accent); }

/* --------------------------- ecran d'accueil ----------------------------
   Une conversation commence par une page blanche et une invitation, pas par
   un rapport que personne n'a demande. */
.accueil {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  align-items: center; gap: 18px; padding: 24px; text-align: center;
}
.accueil .salut {
  font-size: 27px; font-weight: 300; letter-spacing: -.01em; color: var(--ink-1);
}
.accueil .salut b { font-weight: 600; }
.accueil .invite { font-size: 13px; color: var(--ink-muted); max-width: 420px; }
.accueil .amorces { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center;
                    max-width: 520px; }
.accueil .amorces button {
  font-size: 12px; padding: 7px 13px; border-radius: 16px;
  border: 1px solid var(--grid); background: var(--surface-1);
  color: var(--ink-2); cursor: pointer;
}
.accueil .amorces button:hover { border-color: var(--accent); color: var(--accent); }

/* saisie centree tant que la conversation n'a pas commence */
#chat.vierge #saisie-chat {
  border-top: none; padding: 0 24px 34px; max-width: 660px;
  margin: 0 auto; width: 100%;
}
#chat.vierge #fil { justify-content: center; }

/* accuse de reception : la phrase qui precede le travail */
.ack {
  font-size: 13px; color: var(--ink-2); font-style: italic;
  animation: etape-entre .22s ease-out;
}

/* historique detaille, dans le corps du panneau */
.table-fils { width: 100%; }
.ligne-fil {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 11px 12px; border: none; border-bottom: 1px solid var(--grid);
  background: none; color: var(--ink-1); cursor: pointer;
}
.ligne-fil:hover { background: var(--plane); }
.ligne-fil .quand { font-size: 11.5px; color: var(--ink-muted); white-space: nowrap; }
.ligne-fil .titre-fil { flex: 1; font-size: 13px; }
.ligne-fil .outils-fil { display: flex; gap: 2px; opacity: 0; }
.ligne-fil:hover .outils-fil { opacity: 1; }
.ligne-fil .outils-fil button {
  border: none; background: none; color: var(--ink-muted); cursor: pointer;
  padding: 4px 6px; border-radius: 6px; font-size: 11px;
}
.ligne-fil .outils-fil button:hover { background: var(--surface-1); color: var(--ink-1); }
#chat header {
  display: flex; align-items: center; gap: 9px; padding: 12px 14px;
  border-bottom: 1px solid var(--grid); flex: none;
}
.jeton-chat {
  width: 27px; height: 27px; border-radius: 8px; flex: none; background: var(--accent);
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px;
}
.jeton-chat::before { content: "C"; }
#chat header .nom-chat { font-weight: 650; font-size: 13.5px; }
#chat header .etat-chat { font-size: 11px; color: var(--ink-muted); }
#chat header .actions { margin-left: auto; display: flex; gap: 2px; }
#chat header .actions button {
  border: none; background: none; color: var(--ink-muted); cursor: pointer;
  padding: 4px 6px; border-radius: 6px; display: grid; place-items: center;
}
#chat header .actions button:hover { background: var(--plane); color: var(--ink-1); }
#chat header .actions svg { width: 15px; height: 15px; }

/* ----------------------- tiroir d'historique (bulle reduite) -----------
   Le rail n'est affiche en permanence qu'en mode agrandi (#chat.plein).
   Tant que la conversation tient dans la bulle reduite, l'historique se
   consulte par un tiroir qui entre par la gauche, ouvert par #ouvrir-rail. */
#ouvrir-rail {
  display: none; border: none; background: none; color: var(--ink-muted);
  cursor: pointer; padding: 4px 6px; border-radius: 6px; place-items: center;
}
#chat:not(.plein) #ouvrir-rail { display: grid; }
#ouvrir-rail:hover { background: var(--plane); color: var(--ink-1); }
#ouvrir-rail svg { width: 18px; height: 18px; }

#chat:not(.plein) #rail-chat {
  display: flex; flex-direction: column;
  position: absolute; inset: 0 auto 0 0; z-index: 90;
  width: min(300px, 86%); flex: none;
  border-right: 1px solid var(--grid); background: var(--rail);
  transform: translateX(-100%);
  transition: transform .28s ease;
}
#chat:not(.plein).tiroir #rail-chat {
  transform: translateX(0);
  box-shadow: 0 0 42px rgba(0, 0, 0, .32);
}
@media (prefers-reduced-motion: reduce) {
  #chat:not(.plein) #rail-chat { transition: none; }
}

#voile-rail { display: none; }
#chat:not(.plein).tiroir #voile-rail {
  display: block; position: absolute; inset: 0; z-index: 85;
  background: rgba(0, 0, 0, .38); animation: voile-entre .2s ease;
}
@keyframes voile-entre { from { opacity: 0 } }

#fil { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex;
       flex-direction: column; gap: 18px; scroll-behavior: smooth; }
.tour { display: flex; flex-direction: column; gap: 6px; }
.tour.humain { align-items: flex-end; }
.tour.humain .bulle {
  background: var(--plane); border: 1px solid var(--grid);
  border-radius: 16px 16px 4px 16px; padding: 9px 14px; max-width: 86%;
}
.tour.machine .bulle { max-width: 100%; line-height: 1.62; }
.tour.machine .bulle p:first-child { margin-top: 0; }
.tour.machine .bulle p:last-child { margin-bottom: 0; }
.signature {
  display: flex; align-items: center; gap: 7px; font-size: 11px;
  color: var(--ink-muted); font-weight: 600;
}
.signature .jeton {
  width: 19px; height: 19px; border-radius: 6px; display: grid; place-items: center;
  background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; flex: none;
}

/* --------------------------- pied de message ----------------------------
   Heure, copie, appreciation. Les boutons ne se montrent qu'au survol du
   message : ils sont disponibles sans encombrer la lecture. */
.pied-message {
  display: flex; align-items: center; gap: 2px; font-size: 11px;
  color: var(--ink-muted); margin-top: 2px; min-height: 22px;
}
.tour.humain .pied-message { justify-content: flex-end; padding-right: 3px; }
.pied-message .heure { margin-right: 4px; }
.pied-message .outils { display: flex; gap: 1px; opacity: 0; transition: opacity .14s ease; }
.tour:hover .pied-message .outils,
.tour:focus-within .pied-message .outils { opacity: 1; }
.pied-message button {
  border: none; background: none; color: var(--ink-muted); cursor: pointer;
  padding: 3px 5px; border-radius: 6px; display: grid; place-items: center;
}
.pied-message button:hover { background: var(--plane); color: var(--ink-1); }
.pied-message button svg { width: 13px; height: 13px; }
.pied-message button.actif { color: var(--accent); }
.pied-message button.actif.contre { color: var(--critical); }
.pied-message .accuse { font-size: 11px; color: var(--good); font-weight: 600; }

/* --------------------------------- reflexion ----------------------------
   Les etapes reellement parcourues, pas une animation decorative. Repliee
   une fois la reponse ecrite : disponible pour qui veut contester, discrete
   pour qui veut juste lire. */
.pense {
  border: 1px solid var(--grid); border-radius: 10px; background: var(--plane);
  margin-bottom: 10px; overflow: hidden;
}
.pense > summary {
  list-style: none; cursor: pointer; padding: 8px 11px; font-size: 12px;
  color: var(--ink-2); display: flex; align-items: center; gap: 8px; font-weight: 600;
}
.pense > summary::-webkit-details-marker { display: none; }
.pense > summary::after {
  content: "›"; margin-left: auto; color: var(--ink-muted);
  transition: transform .18s ease; font-size: 15px; line-height: 1;
}
.pense[open] > summary::after { transform: rotate(90deg); }
.pense > summary:hover { background: color-mix(in srgb, var(--ink-1) 4%, var(--plane)); }
.pense .sablier {
  width: 11px; height: 11px; border-radius: 50%; flex: none;
  border: 2px solid var(--accent); border-top-color: transparent;
  animation: tourne .8s linear infinite;
}
@keyframes tourne { to { transform: rotate(360deg) } }
.pense.finie .sablier {
  border: none; background: none; color: var(--good); animation: none;
  display: grid; place-items: center; width: 13px; height: 13px;
}
.pense.finie .sablier::before { content: "✓"; font-size: 11px; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .pense .sablier { animation: none } }

.reflexion {
  font-size: 12px; color: var(--ink-muted); padding: 2px 11px 11px 13px;
  display: flex; flex-direction: column; gap: 7px;
}
.reflexion .etape {
  display: flex; gap: 9px; animation: etape-entre .22s ease-out;
  border-left: 2px solid var(--grid); padding-left: 10px;
}
.reflexion .etape.encours { border-left-color: var(--accent); }
.reflexion .etape.faite { border-left-color: var(--good); }
@keyframes etape-entre { from { opacity: 0; transform: translateY(-3px) } }
.reflexion .etape b { color: var(--ink-2); font-weight: 600; display: block; }
.reflexion .etape span { display: block; }

.curseur {
  display: inline-block; width: 2px; height: 15px; vertical-align: text-bottom;
  background: var(--ink-1); margin-left: 2px; animation: clignote .9s step-end infinite;
}
@keyframes clignote { 50% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .curseur { animation: none } }

.effet {
  margin-top: 8px; border: 1px solid var(--grid); border-radius: 10px;
  background: var(--plane); padding: 10px 12px; font-size: 12.5px;
}
.effet .titre-effet {
  font-weight: 650; font-size: 11px; text-transform: uppercase;
  letter-spacing: .05em; color: var(--ink-muted); margin-bottom: 6px;
}
.effet table { font-size: 12px; }
.effet td, .effet th { padding: 4px 7px; }

#saisie-chat { flex: none; border-top: 1px solid var(--grid); padding: 11px 12px; }
#pistes { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 9px; }
#pistes button {
  font-size: 11.5px; padding: 4px 9px; border-radius: 14px;
  border: 1px solid var(--grid); background: var(--surface-1);
  color: var(--ink-2); cursor: pointer;
}
#pistes button:hover { border-color: var(--accent); color: var(--accent); }
.zone-saisie {
  display: flex; align-items: flex-end; gap: 8px;
  border: 1px solid var(--grid); border-radius: 12px; padding: 7px 7px 7px 12px;
  background: var(--plane);
}
.zone-saisie:focus-within { border-color: var(--accent); }
#question {
  flex: 1; border: none; background: none; color: var(--ink-1); resize: none;
  font: inherit; font-size: 13.5px; max-height: 132px; padding: 4px 0; outline: none;
}
#envoyer {
  width: 30px; height: 30px; border-radius: 8px; border: none; flex: none;
  /* padding: 0 explicite — la regle generique `button` impose 6px 12px, ce qui
     reduit la boite de contenu a 6px et decale la fleche vers la droite. */
  padding: 0;
  background: var(--accent); color: #fff; cursor: pointer; display: grid; place-items: center;
}
#envoyer:disabled { opacity: .38; cursor: default; }
#envoyer svg { width: 15px; height: 15px; }

@media (max-width: 620px) {
  #chat { right: 10px; bottom: 10px; width: calc(100vw - 20px); height: calc(100vh - 20px); }

  /* Sur mobile, « agrandir » n'a pas d'objet : la bulle occupe deja tout
     l'ecran et l'historique se consulte par le tiroir. */
  #agrandir { display: none; }
}

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--ink-muted); font-weight: 600; font-size: 11px;
     text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px;
     border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--grid); }
tr:last-child td { border-bottom: none; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }

/* Les couleurs d'etat sont toujours doublees d'un libelle : deux d'entre
   elles passent sous 3:1 en mode clair, la teinte ne peut pas porter seule. */
.etat { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px;
        border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid; white-space: nowrap; }
.etat.critical, .etat.critique, .etat.injoignable { color: var(--critical); border-color: var(--critical); }
.etat.high, .etat.haute, .etat.degrade { color: var(--serious); border-color: var(--serious); }
.etat.medium, .etat.moyenne { color: var(--warning); border-color: var(--warning); }
.etat.low, .etat.basse, .etat.info, .etat.nominal { color: var(--good); border-color: var(--good); }

.fam { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
.puce { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.puce.A { background: var(--fam-A); } .puce.B { background: var(--fam-B); }
.puce.C { background: var(--fam-C); } .puce.D { background: var(--fam-D); }

/* barres : marques fines, labels directs (relief obligatoire en mode clair) */
.barres { display: flex; flex-direction: column; gap: 9px; }
.barre { display: grid; grid-template-columns: 172px 1fr 40px; align-items: center; gap: 10px; }
.barre .nom { font-size: 12px; color: var(--ink-2); }
.piste { background: var(--grid); border-radius: 4px; height: 12px; overflow: hidden; }
.remplissage { height: 100%; border-radius: 4px; }
.barre .val { font-size: 12px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

.deux { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
@media (max-width: 1080px) { .deux { grid-template-columns: 1fr; } }

.vide { color: var(--ink-muted); padding: 26px 10px; text-align: center; }
.muet { color: var(--ink-muted); font-size: 12px; }
a { color: var(--accent); }

/* flux d'actions */
.flux { display: flex; flex-direction: column; gap: 0; }
.evt { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 9px 0;
       border-bottom: 1px solid var(--grid); font-size: 13px; }
.evt:last-child { border-bottom: none; }
.evt .quand { color: var(--ink-muted); font-size: 11px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.evt .quoi { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }

/* cartes d'attaque */
.attaques { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.attaque { background: var(--surface-1); border: 1px solid var(--ring); border-radius: 9px;
           padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.attaque .tete { display: flex; align-items: baseline; gap: 8px; }
.attaque .code { font-weight: 700; font-size: 12px; letter-spacing: .04em; }
.attaque .titre { font-size: 13px; font-weight: 600; line-height: 1.35; }
.attaque .recit { color: var(--ink-2); font-size: 12px; line-height: 1.45; }
.attaque .pied { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 4px; }

.etape { border-left: 2px solid var(--accent); padding: 2px 0 2px 13px; margin-bottom: 10px; }
.etape .quoi2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
                color: var(--ink-muted); font-weight: 600; }

/* rendu markdown de l'assistant et des rapports */
.md h3 { font-size: 14px; margin: 14px 0 6px; color: var(--ink-1); }
.md h4 { font-size: 13px; margin: 12px 0 4px; color: var(--ink-2); }
.md p { margin: 6px 0; } .md ul { margin: 6px 0; padding-left: 20px; }
.md li { margin: 3px 0; } .md table { margin: 8px 0; }
.md blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--serious);
                 background: color-mix(in srgb, var(--serious) 8%, transparent); }
.md hr { border: none; border-top: 1px solid var(--grid); margin: 14px 0; }
.md code { background: var(--plane); padding: 1px 5px; border-radius: 4px;
           font-family: ui-monospace, Menlo, monospace; font-size: 12px; }

@media (max-width: 860px) {
  body:not(.hors-session) { grid-template-columns: 60px 1fr; }
  .marque .nom, .marque .ver, .lien-nav span, .lien-nav .pastille { display: none; }
  .lien-nav { justify-content: center; padding: 10px; }
  .marque { justify-content: center; padding: 14px 0 10px; }
}

/* ===================== connexion, inscription, accueil ==================
   Avant la session : le rail et l'en-tête sont masqués, la vue occupe tout
   l'écran. Logos ANTIC + plateforme centrés en haut, conformément à la
   demande du CDCF (séparation des rôles). */
body.hors-session { grid-template-columns: 1fr; }
body.hors-session #rail,
body.hors-session #entete,
body.hors-session #lanceur-chat,
body.hors-session #chat { display: none !important; }
body.hors-session #contenu { height: 100vh; }
body.hors-session main { display: grid; place-items: center; padding: 24px; }

.ecran-auth {
  width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 18px;
}
.logos-auth {
  display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 4px;
}
.logos-auth img { height: 64px; width: auto; display: block; object-fit: contain; }
.logos-auth .sep-logo { width: 1px; height: 44px; background: var(--grid); }
.carte-auth {
  background: var(--surface-1); border: 1px solid var(--grid); border-radius: 14px;
  padding: 22px 22px 20px; box-shadow: 0 18px 50px rgba(0, 0, 0, .12);
}
.carte-auth h1 { font-size: 17px; margin: 0 0 3px; }
.carte-auth .sous { font-size: 12.5px; color: var(--ink-muted); margin-bottom: 16px; }
.champ-auth { display: flex; flex-direction: column; gap: 4px; margin-bottom: 11px; }
.champ-auth label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.champ-auth input, .champ-auth select {
  font: inherit; font-size: 13.5px; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--grid); background: var(--plane); color: var(--ink-1);
}
.champ-auth input:focus, .champ-auth select:focus { outline: none; border-color: var(--accent); }
.grille-champs { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.carte-auth button.primaire {
  width: 100%; justify-content: center; margin-top: 6px; padding: 9px;
  background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
}
.carte-auth button.primaire:hover { filter: brightness(1.07); }
.erreur-auth {
  font-size: 12.5px; color: var(--critical); margin-top: 10px; min-height: 1em;
}
.lien-auth {
  text-align: center; font-size: 12.5px; margin-top: 4px; color: var(--ink-muted);
}
.lien-auth a { color: var(--accent); cursor: pointer; }
.lien-auth a:hover { text-decoration: underline; }
.info-auth {
  background: color-mix(in srgb, var(--fam-C) 10%, var(--surface-1));
  border: 1px solid color-mix(in srgb, var(--fam-C) 35%, transparent);
  border-radius: 10px; padding: 14px 15px; font-size: 13px;
}

/* page d'accueil (portail) — plein écran, sans rail ni barre du haut */
body.sur-accueil { grid-template-columns: 1fr; }
body.sur-accueil #rail,
body.sur-accueil #entete,
body.sur-accueil #lanceur-chat,
body.sur-accueil #chat { display: none !important; }
body.sur-accueil #contenu { height: 100vh; }
body.sur-accueil main { display: block; padding: 44px 24px 60px; max-width: none; }

.portail { width: 100%; max-width: 940px; margin: 0 auto; text-align: center; }
.titre-accueil {
  font-family: inherit; font-size: 15px; font-weight: 700; letter-spacing: .28em;
  text-transform: uppercase; color: var(--ink-2); margin: 0 0 26px; text-align: center;
}
.portail .logos-auth { margin-bottom: 14px; }
.portail .salut { font-size: 25px; font-weight: 300; color: var(--ink-1); margin-bottom: 4px; }
.portail .salut b { font-weight: 600; }
.deco-portail {
  margin: 26px auto 0; display: block; border: 1px solid var(--grid);
  background: var(--surface-1); color: var(--ink-2); border-radius: 9px;
  padding: 9px 20px; font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.deco-portail:hover { border-color: var(--critical); color: var(--critical); }
.portail .role-badge {
  display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 26px;
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  border-radius: 20px; padding: 2px 11px;
}
.tuiles-portail {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 12px; text-align: left;
}
.tuile-portail {
  display: flex; flex-direction: column; gap: 7px; padding: 16px;
  border: 1px solid var(--grid); border-radius: 12px; background: var(--surface-1);
  cursor: pointer; color: var(--ink-1); transition: border-color .14s, transform .14s;
}
.tuile-portail:hover { border-color: var(--accent); transform: translateY(-2px); }
.tuile-portail svg { width: 22px; height: 22px; color: var(--accent); }
.tuile-portail .t-titre { font-weight: 650; font-size: 14px; }
.tuile-portail .t-sous { font-size: 11.5px; color: var(--ink-muted); }

/* pied du rail : identité de session + déconnexion */
#pied-session {
  border-top: 1px solid var(--grid); padding: 10px 12px 12px; display: flex;
  flex-direction: column; gap: 7px; font-size: 11px;
}
#pied-session .qui { color: var(--ink-2); font-weight: 600; }
#pied-session .qui small { display: block; color: var(--ink-muted); font-weight: 400; }
#pied-session button {
  border: 1px solid var(--grid); background: var(--surface-1); color: var(--ink-2);
  border-radius: 7px; padding: 5px 8px; font-size: 11.5px; cursor: pointer;
}
#pied-session button:hover { border-color: var(--critical); color: var(--critical); }
#lien-accueil {
  border: 1px solid var(--grid); background: var(--surface-1); color: var(--ink-2);
  border-radius: 7px; padding: 6px 10px; font-size: 12px; cursor: pointer;
}
#lien-accueil:hover { border-color: var(--accent); color: var(--accent); }

/* Bascule de thème : un soleil qui devient lune. Les rayons se rétractent et
   s'effacent, un disque masque vient creuser le croissant. */
.btn-theme {
  width: 34px; height: 30px; padding: 0; border-radius: 8px;
  border: 1px solid var(--ring); background: var(--surface-1); color: var(--ink-2);
  display: grid; place-items: center; cursor: pointer;
}
.btn-theme:hover { border-color: var(--accent); color: var(--accent); }
.ico-theme { width: 18px; height: 18px; overflow: visible; }
.ico-theme .disque {
  transform-origin: center; transition: r .45s cubic-bezier(.4, 0, .2, 1);
}
.ico-theme .croissant {
  transition: transform .5s cubic-bezier(.5, 0, .3, 1);
}
.ico-theme .rayons {
  transform-origin: center;
  transition: transform .5s cubic-bezier(.5, 0, .3, 1), opacity .3s ease;
}
.ico-theme .rayons line {
  transform-origin: center; transition: transform .45s cubic-bezier(.5, 0, .3, 1);
}
/* état sombre : lune */
.btn-theme.sombre .ico-theme .rayons { transform: rotate(-25deg) scale(.55); opacity: 0; }
.btn-theme.sombre .ico-theme .rayons line { transform: scaleY(0); }
.btn-theme.sombre .ico-theme .croissant { transform: translate(-14px, 3px); }
.btn-theme.sombre .ico-theme .disque { r: 7; }
@media (prefers-reduced-motion: reduce) {
  .ico-theme *, .ico-theme { transition-duration: 0s; }
}

/* Notifications éphémères (toasts) — confirment un geste d'administration
   dès qu'il aboutit (création d'un poste, promotion, suppression…). */
#toasts {
  position: fixed; right: 16px; bottom: 16px; z-index: 200;
  display: flex; flex-direction: column; gap: 8px; max-width: min(360px, calc(100vw - 32px));
  pointer-events: none;
}
.toast {
  pointer-events: auto; display: flex; align-items: flex-start; gap: 9px;
  background: var(--surface-1); border: 1px solid var(--grid);
  border-left: 3px solid var(--good); border-radius: 10px;
  padding: 11px 12px; font-size: 12.5px; color: var(--ink-1);
  box-shadow: 0 12px 34px rgba(0, 0, 0, .2);
  animation: toast-entre .22s cubic-bezier(.4, 0, .2, 1);
}
.toast.sortie { animation: toast-sort .2s ease forwards; }
.toast.erreur { border-left-color: var(--critical); }
.toast.info { border-left-color: var(--accent); }
.toast .t-ico { flex: none; width: 15px; height: 15px; margin-top: 1px; }
.toast.ok .t-ico { color: var(--good); }
.toast.erreur .t-ico { color: var(--critical); }
.toast.info .t-ico { color: var(--accent); }
.toast .t-txt { flex: 1; line-height: 1.45; }
.toast .t-fermer {
  flex: none; border: none; background: none; color: var(--ink-muted);
  cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px;
}
.toast .t-fermer:hover { color: var(--ink-1); }
@keyframes toast-entre { from { opacity: 0; transform: translateY(12px) } }
@keyframes toast-sort { to { opacity: 0; transform: translateX(24px) } }
@media (prefers-reduced-motion: reduce) {
  .toast, .toast.sortie { animation: none; }
}

/* La bascule d'autonomie (coupe-circuit EF-26) est un geste d'administrateur :
   masquée pour l'analyste et le décideur. */
#menu-autonomie { display: none; }
body[data-role="admin"] #menu-autonomie,
body[data-role="super_admin"] #menu-autonomie { display: block; }

/* décideur : consultation stricte, aucun geste d'écriture */
body[data-role="decideur"] .reserve-action { display: none !important; }
.bandeau-lecture {
  background: color-mix(in srgb, var(--fam-D) 12%, var(--surface-1));
  border: 1px solid color-mix(in srgb, var(--fam-D) 40%, transparent);
  border-radius: 10px; padding: 9px 13px; font-size: 12.5px; color: var(--ink-2);
  margin-bottom: 16px;
}

/* sections d'administration des Réglages */
.admin-only { display: none; }
body[data-role="admin"] .admin-only,
body[data-role="super_admin"] .admin-only { display: block; }
.rangee-compte {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 0; border-bottom: 1px solid var(--grid);
}
.rangee-compte:last-child { border-bottom: none; }
.rangee-compte .ppal { font-weight: 600; }
.rangee-compte .meta { font-size: 11.5px; color: var(--ink-muted); }
.rangee-compte .actions-compte { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.rangee-compte .actions-compte button { padding: 4px 9px; font-size: 12px; }
.rangee-compte .actions-compte button.danger {
  color: var(--critical);
  border-color: color-mix(in srgb, var(--critical) 45%, transparent);
}
.rangee-compte .actions-compte button.danger:hover {
  background: color-mix(in srgb, var(--critical) 10%, var(--surface-1));
}
.puce-statut {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  padding: 1px 7px; border-radius: 10px; border: 1px solid var(--grid); color: var(--ink-muted);
}
.puce-statut.pending { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 45%, transparent); }
.puce-statut.active { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.puce-statut.suspended, .puce-statut.refused { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 45%, transparent); }
</style>
</head>
<body>

<aside id="rail">
  <div class="marque">
    <div class="logo">C</div>
    <div class="nom">CIRTDEFENSE</div>
  </div>
  <nav id="nav"></nav>
  <div id="pied-session" hidden>
    <span class="qui" id="qui-session"></span>
    <button id="deconnexion" type="button">Se déconnecter</button>
  </div>
</aside>

<div id="contenu">
  <header id="entete">
    <div>
      <h1 id="titre-vue">…</h1>
      <div class="sous" id="sous-vue"></div>
    </div>
    <span class="spacer"></span>
    <button id="lien-accueil" type="button" title="Page d'accueil" hidden>Accueil</button>
    <button id="theme" class="btn-theme" title="Basculer le thème clair / sombre"
            aria-label="Basculer le thème clair / sombre">
      <svg class="ico-theme" viewBox="0 0 24 24" aria-hidden="true">
        <mask id="masque-lune">
          <rect x="0" y="0" width="24" height="24" fill="#fff"/>
          <circle class="croissant" cx="30" cy="4" r="6" fill="#000"/>
        </mask>
        <circle class="disque" cx="12" cy="12" r="5.6" fill="currentColor"
                mask="url(#masque-lune)"/>
        <g class="rayons" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="1.5" x2="12" y2="3.5"/>
          <line x1="12" y1="20.5" x2="12" y2="22.5"/>
          <line x1="3.9" y1="3.9" x2="5.3" y2="5.3"/>
          <line x1="18.7" y1="18.7" x2="20.1" y2="20.1"/>
          <line x1="1.5" y1="12" x2="3.5" y2="12"/>
          <line x1="20.5" y1="12" x2="22.5" y2="12"/>
          <line x1="3.9" y1="20.1" x2="5.3" y2="18.7"/>
          <line x1="18.7" y1="5.3" x2="20.1" y2="3.9"/>
        </g>
      </svg>
    </button>

    <div class="menu" id="menu-autonomie">
      <button id="autonomie" class="bascule" aria-haspopup="true" aria-expanded="false">
        <span class="voyant"></span><span id="autonomie-texte">Autonomie</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" class="chevron"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="menu-liste" id="autonomie-liste" hidden>
        <button data-autonomie="1"><span class="point vert"></span>Activer</button>
        <button data-autonomie="0"><span class="point rouge"></span>Désactiver</button>
      </div>
    </div>
  </header>
  <main>
    <div id="vue"></div>
  </main>
</div>

<button id="lanceur-chat" title="Ouvrir l'assistant" aria-label="Ouvrir l'assistant">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/>
    <path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/>
  </svg>
</button>

<section id="chat" hidden aria-label="Assistant d'exploitation">
  <aside id="rail-chat">
    <div class="marque-chat">
      <div class="logo">C</div>
      <div>
        <div class="nom">CIRTDEFENSE</div>
        <div class="sous-nom">ASSISTANT</div>
      </div>
    </div>

    <div class="barre-outils">
      <button id="voir-historique" title="Voir tout l'historique"
              aria-label="Voir tout l'historique">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
      <div class="menu" id="menu-filtres">
        <button id="filtrer" title="Filtrer les discussions" aria-haspopup="true"
                aria-expanded="false" aria-label="Filtrer les discussions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg>
          <span class="pastille-filtre" id="compte-filtres" hidden></span>
        </button>
        <div class="menu-liste large" id="filtres-liste" hidden></div>
      </div>
      <button id="nouvelle-discussion" class="neuf" title="Nouvelle discussion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        Nouvelle
      </button>
    </div>

    <button class="entete-fils" id="basculer-fils" aria-expanded="true">
      <span>Discussions &amp; Tâches</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" class="chevron"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div id="fils"></div>
  </aside>

  <div id="voile-rail"></div>

  <div id="corps-chat">
  <header>
    <button id="ouvrir-rail" title="Historique des discussions"
            aria-label="Ouvrir l'historique des discussions" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round"><path d="M4 8h16"/><path d="M4 16h9"/></svg>
    </button>
    <span class="jeton-chat"></span>
    <div>
      <div class="nom-chat">Assistant</div>
      <div class="etat-chat" id="etat-chat">Adossé aux données de la plateforme</div>
    </div>
    <div class="actions">
      <button id="agrandir" title="Agrandir" aria-label="Agrandir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/>
        <path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
      </button>
      <button id="vider-chat" title="Nouvelle conversation" aria-label="Nouvelle conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </button>
      <button id="fermer-chat" title="Fermer" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </header>

  <div id="fil"></div>

  <div id="saisie-chat">
    <div id="pistes"></div>
    <div class="zone-saisie">
      <textarea id="question" rows="1" placeholder="Poser une question, demander une simulation…"
                aria-label="Question à l'assistant"></textarea>
      <button id="envoyer" title="Envoyer" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </div>
  </div>
  </div>
</section>

<div id="modales"></div>
<div id="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="/static/app.js"></script>
</body>
